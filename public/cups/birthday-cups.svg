<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F5F0E8"/>
  <!-- Festive birthday cup with confetti and decorations -->
  <path d="M120 90 L280 90 L255 320 L145 320 Z" fill="#fff" stroke="#D4A857" stroke-width="2"/>
  <!-- Top rim -->
  <rect x="114" y="78" width="172" height="17" rx="8.5" fill="#2A1506"/>
  <!-- Sleeve with festive design -->
  <path d="M133 168 L267 168 L257 280 L143 280 Z" fill="#2A1506"/>
  <!-- Decorative festive band -->
  <path d="M133 168 L267 168" stroke="#D4A857" stroke-width="3" opacity="0.8"/>
  <!-- Logo -->
  <text x="200" y="210" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="13" fill="#D4A857">קפה גינץ</text>
  <text x="200" y="225" text-anchor="middle" font-family="Arial" font-size="8" fill="#D4A857">GINTZ COFFEE</text>
  <!-- Small star decorations on sleeve -->
  <polygon points="150,250 151.5,254.5 156,254.5 152.5,257 154,261.5 150,259 146,261.5 147.5,257 144,254.5 148.5,254.5" fill="#D4A857" opacity="0.8"/>
  <polygon points="250,250 251.5,254.5 256,254.5 252.5,257 254,261.5 250,259 246,261.5 247.5,257 244,254.5 248.5,254.5" fill="#D4A857" opacity="0.8"/>
  <!-- Decorative lines -->
  <path d="M140 153 L260 153" stroke="#D4A857" stroke-width="1" opacity="0.4"/>
  <!-- Confetti dots around -->
  <circle cx="80" cy="120" r="5" fill="#D4A857" opacity="0.7"/>
  <circle cx="95" cy="155" r="3.5" fill="#5C3015" opacity="0.6"/>
  <circle cx="70" cy="190" r="4" fill="#D4A857" opacity="0.5"/>
  <circle cx="315" cy="130" r="4" fill="#D4A857" opacity="0.7"/>
  <circle cx="330" cy="165" r="3" fill="#5C3015" opacity="0.6"/>
  <circle cx="320" cy="200" r="5" fill="#D4A857" opacity="0.5"/>
  <circle cx="85" cy="240" r="3" fill="#D4A857" opacity="0.4"/>
  <circle cx="325" cy="240" r="3" fill="#D4A857" opacity="0.4"/>
  <!-- Tiny confetti rectangles -->
  <rect x="75" y="270" width="8" height="4" rx="1" fill="#D4A857" opacity="0.5" transform="rotate(-20 75 270)"/>
  <rect x="318" y="280" width="8" height="4" rx="1" fill="#5C3015" opacity="0.5" transform="rotate(15 318 280)"/>
  <rect x="100" y="300" width="6" height="3" rx="1" fill="#D4A857" opacity="0.4" transform="rotate(30 100 300)"/>
  <!-- Large star above cup -->
  <polygon points="200,18 203,27 213,27 205,33 208,42 200,36 192,42 195,33 187,27 197,27" fill="#D4A857" opacity="0.9"/>
  <!-- Steam -->
  <path d="M175 58 Q180 43 175 28" fill="none" stroke="#D4A857" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M200 53 Q205 38 200 23" fill="none" stroke="#D4A857" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M225 58 Q230 43 225 28" fill="none" stroke="#D4A857" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Bottom ellipse -->
  <ellipse cx="200" cy="320" rx="55" ry="9" fill="#e8ddd0"/>
</svg>
