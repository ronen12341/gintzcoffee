<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#F5F0E8"/>
  <!-- Single large cup showing print detail / color layers concept -->
  <path d="M120 80 L280 80 L255 330 L145 330 Z" fill="#fff" stroke="#D4A857" stroke-width="2"/>
  <!-- Top rim -->
  <rect x="114" y="68" width="172" height="18" rx="9" fill="#2A1506"/>
  <!-- Full sleeve design - showing printing capability -->
  <path d="M133 160 L267 160 L257 285 L143 285 Z" fill="#2A1506"/>
  <!-- Decorative print bands (simulating CMYK color layers) -->
  <rect x="133" y="160" width="134" height="5" fill="#D4A857" opacity="0.7"/>
  <!-- Logo text on sleeve -->
  <text x="200" y="205" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="14" fill="#D4A857">קפה גינץ</text>
  <text x="200" y="222" text-anchor="middle" font-family="Arial" font-size="9" fill="#D4A857">GINTZ COFFEE</text>
  <!-- Color dots representing CMYK print -->
  <circle cx="155" cy="248" r="8" fill="#D4A857" opacity="0.9"/>
  <circle cx="175" cy="248" r="8" fill="#5C3015" opacity="0.9"/>
  <circle cx="195" cy="248" r="8" fill="#2A1506" opacity="0.9"/>
  <circle cx="215" cy="248" r="8" fill="#e8ddd0" stroke="#D4A857" stroke-width="1" opacity="0.9"/>
  <text x="200" y="270" text-anchor="middle" font-family="Arial" font-size="7" fill="#D4A857">עד 4 צבעים</text>
  <!-- Decorative horizontal line -->
  <path d="M140 145 L260 145" stroke="#D4A857" stroke-width="1" opacity="0.4"/>
  <!-- Stars / sparkles -->
  <circle cx="145" cy="115" r="3" fill="#D4A857" opacity="0.6"/>
  <circle cx="255" cy="115" r="3" fill="#D4A857" opacity="0.6"/>
  <!-- Steam -->
  <path d="M175 48 Q180 33 175 18" fill="none" stroke="#D4A857" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M200 43 Q205 28 200 13" fill="none" stroke="#D4A857" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M225 48 Q230 33 225 18" fill="none" stroke="#D4A857" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Bottom ellipse -->
  <ellipse cx="200" cy="330" rx="55" ry="9" fill="#e8ddd0"/>
</svg>
